{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<section class="app-page container">
  <form class="card form-card auth-card" method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) if request.args.get('next') else url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <span class="page-kicker">Welcome back</span>
    <h1 class="form-title">Log in</h1>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <div class="label-row">
        <label for="password">Password</label>
        <a href="{{ url_for('auth.forgot_password') }}">Forgot it?</a>
      </div>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-block">Log in</button>

    <p class="auth-links">New here? <a href="{{ url_for('auth.register', next=request.args.get('next')) if request.args.get('next') else url_for('auth.register') }}">Create an account</a></p>
    {% if show_demo_login %}
      <p class="auth-links mono">Just browsing? demo@uw.edu / demopass123</p>
    {% endif %}
  </form>
</section>
{% endblock %}
