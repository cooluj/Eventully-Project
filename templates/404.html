{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block content %}
<section class="app-page container-narrow error-page">
  <div class="error-code" aria-hidden="true">404</div>
  <span class="page-kicker">Not found</span>
  <h1>This page isn't in the directory</h1>
  <p class="muted">The club, event, or page you're after doesn't exist or was moved.</p>
  <div class="hero-actions" style="justify-content:center;">
    <a href="{{ url_for('main.index') }}" class="btn">Back to Eventully</a>
    <a href="{{ url_for('clubs.browse') }}" class="btn btn-ghost">Browse clubs</a>
  </div>
</section>
{% endblock %}
