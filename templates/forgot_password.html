{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}

{% block content %}
<section class="app-page container">
  <form class="card form-card auth-card" method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <span class="page-kicker">Account recovery</span>
    <h1 class="form-title">Reset your password</h1>
    <p class="form-lede">Enter your Eventully email and we'll send a reset link that works for one hour.</p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>
    </div>

    <button type="submit" class="btn btn-block">Send reset link</button>
    <p class="auth-links">Remembered it? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </form>
</section>
{% endblock %}
