{% extends "base.html" %}
{% block title %}Something broke{% endblock %}
{% block content %}
<section class="app-page container-narrow error-page">
  <div class="error-code" aria-hidden="true">500</div>
  <span class="page-kicker">Something broke</span>
  <h1>Something broke on our end</h1>
  <p class="muted">Not you, us. Try again in a moment; if it keeps happening, it's already on the fix-it list.</p>
  <div class="hero-actions" style="justify-content:center;">
    <a href="{{ url_for('main.index') }}" class="btn">Back to Eventully</a>
    
  </div>
</section>
{% endblock %}
