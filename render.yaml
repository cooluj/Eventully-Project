# Render Blueprint — one-click deploy.
# In Render: New → Blueprint → connect this repo. It provisions the web
# service and generates a SECRET_KEY. On first boot the app creates tables
# and loads all 1,231 clubs automatically (AUTO_SEED).
#
# The production service (eventully.org) runs on the Starter plan against a
# PAID Postgres instance (eventully-db-prod). Never point it at a free
# Render Postgres: those are deleted 30 days after creation, which is how
# the July launch data was lost.
services:
  - type: web
    name: eventully
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Single process (the in-memory rate limiter is per-process) with threads
    # so one slow request doesn't serialize the whole site.
    startCommand: gunicorn --workers 1 --threads 8 --timeout 60 app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # The paid Postgres instance's internal connection string. Set in the
      # dashboard — deliberately not provisioned here so a blueprint re-apply
      # can't swap it for a free (auto-deleting) database.
      - key: DATABASE_URL
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: SECURE_COOKIES
        value: "true"
      - key: SEED_DEMO_ACCOUNT
        value: "false"
      - key: REQUIRE_EDU_EMAIL
        value: "true"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      # Set this to YOUR email in the Render dashboard so you can approve club claims
      - key: ADMIN_EMAILS
        sync: false
      # Set to your custom domain (e.g. eventully.org) after attaching it in
      # Render — other hosts then 301 to it.
      - key: CANONICAL_HOST
        sync: false
      # Shared secret for the scheduled digest/reminder endpoints; the same
      # value goes in the GitHub Actions secret TASKS_TOKEN.
      - key: TASKS_TOKEN
        sync: false
      # Configure these to enable verification, reset, claim, team, and message emails.
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USE_TLS
        value: "true"
